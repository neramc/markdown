<!--
  Stand-in for the IntelliJ Platform's expui/general/chevronRight icon.

  Jewel resolves its built-in component icons from the IntelliJ platform's icon jars, which are not
  published to Maven Central. The submenu arrow in every popup menu resolves through
  `AllIconsKeys.General.ChevronRight`, and with nothing at that path Jewel drew a filled grey square
  beside File, Edit, View, Tools, Run and Help. Placing a replacement at the exact resource path
  Jewel asks for lets its own resolver find it, with no patching of Jewel itself. Drawn to
  IntelliJ's 16x16 grid and stroked with currentColor so it picks up the theme's foreground.
-->
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M6.5 4L10.5 8L6.5 12" stroke="currentColor" stroke-width="1.2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
