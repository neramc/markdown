<!--
  Stand-in for the IntelliJ Platform's expui/general/chevronUp icon.

  Shipped alongside chevronDown and chevronRight, which Jewel's dropdown and submenu components
  resolve by name. Jewel reads its built-in icons from the IntelliJ platform's icon jars, which are
  not published to Maven Central, so a standalone application must supply them at the exact resource
  path Jewel asks for or get a filled grey square where the glyph should be. Drawn to IntelliJ's
  16x16 grid and stroked with currentColor so it picks up the theme's foreground.
-->
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M4 9.5L8 5.5L12 9.5" stroke="currentColor" stroke-width="1.2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
