<!--
  Stand-in for the IntelliJ Platform's expui/general/chevronDown icon.

  Jewel resolves its built-in component icons from the IntelliJ platform's icon jars, which are not
  published to Maven Central, so a standalone Jewel application has no chevron for dropdowns. Placing
  a replacement at the exact resource path Jewel asks for lets its own resolver find it, with no
  patching of Jewel itself. Drawn to IntelliJ's 16x16 grid and stroked with currentColor so it picks
  up the theme's foreground.
-->
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M4 6.5L8 10.5L12 6.5" stroke="currentColor" stroke-width="1.2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
