name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The Rust engine on its own. It is the fastest job and the one most changes touch, so failing it
  # early avoids spending the matrix's time on a build that cannot pass.
  engine:
    name: Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: quill-core

      - name: Format
        run: cargo fmt --manifest-path quill-core/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path quill-core/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path quill-core/Cargo.toml

  # The bridge and the application, on every platform Quill ships to.
  #
  # The matrix is the release matrix, deliberately. A break that only appears on an Intel Mac or on
  # arm64 Linux is one somebody has to find, and finding it on release day means deleting a tag --
  # so it is found here, on every push, instead. GitHub's arm64 and Intel-Mac runners are free for
  # public repositories, which is what makes covering all five affordable rather than aspirational.
  jvm:
    name: JVM (${{ matrix.target }})
    needs: engine
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          # macos-latest has been Apple Silicon since macOS 14, so this entry is what covers Intel.
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-latest
          - target: windows-x64
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: quill-core

      # A JDK for Gradle itself to run on. The compile toolchain is a different JDK, provisioned by
      # the foojay resolver from the version catalog.
      - name: Set up a JDK for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # jpackage shells out to these; without them the bundler is skipped and the packaging task
      # fails with a message that says nothing about the missing tool.
      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils rpm

      # The UI tests compose offscreen through Skia and need no display server.
      - name: Build and test
        run: ./gradlew build

      # Gradle buries the one line that says what went wrong. The reasons, and why this is a script
      # rather than a link to a report, are in the script.
      - name: Say which tests failed
        if: failure()
        shell: bash
        run: tools/show-test-failures.sh

      # createReleaseDistributable is the one packaging task that exists on every platform. The
      # native installers are per-OS and are built in the steps below, because there is no Windows
      # target format declared at all -- Windows is served by the separate setup project.
      - name: Build the release application image
        run: ./gradlew :quill-app:createReleaseDistributable --stacktrace

      # The portable archive is a shipped artifact, so it is built on every push rather than only on
      # a tag: the executable-bit assertion inside the task is a real check and only runs here.
      - name: Package the portable archive
        run: ./gradlew :quill-app:packagePortable --stacktrace

      - name: Build the Linux packages
        if: runner.os == 'Linux'
        run: ./gradlew :quill-app:packageReleaseDeb :quill-app:packageReleaseRpm --stacktrace

      - name: Build the macOS package
        if: runner.os == 'macOS'
        run: ./gradlew :quill-app:packageReleaseDmg --stacktrace

      - name: Upload the offscreen UI renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-renders-${{ matrix.target }}
          path: quill-app/build/test-renders/
          if-no-files-found: warn

      - name: Upload the application image
        uses: actions/upload-artifact@v4
        with:
          name: app-image-${{ matrix.target }}
          path: quill-app/build/compose/binaries/main-release/app/
          if-no-files-found: error

      - name: Upload the native packages
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: |
            quill-app/build/compose/binaries/main-release/deb/
            quill-app/build/compose/binaries/main-release/rpm/
            quill-app/build/compose/binaries/main-release/dmg/
            quill-app/build/portable/
          if-no-files-found: warn

  # The setup project's own tests need neither Windows nor an application image, so they run on
  # Linux alongside the matrix rather than waiting for it.
  setup-tests:
    name: Setup tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test installer-windows/Quill.Setup.sln --configuration Release

      - name: Upload the headless wizard renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-ui-renders
          path: installer-windows/**/bin/**/ui-renders/
          if-no-files-found: warn

  # QuillSetup.exe carries a Windows application image, and jpackage cannot cross-build one -- hence
  # the dependency on the Windows leg of the matrix. Publishing itself cross-compiles fine, so this
  # runs on Linux.
  setup-package:
    name: Windows setup
    needs: [jvm, setup-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download the Windows application image
        uses: actions/download-artifact@v4
        with:
          name: app-image-windows-x64
          path: app-image

      - name: Build the installer and uninstaller
        run: tools/build-installer.sh --app-image app-image/Quill

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: |
            installer-windows/artifacts/installer/QuillSetup.exe
            installer-windows/artifacts/uninstaller/QuillUninstall.exe
          if-no-files-found: error
